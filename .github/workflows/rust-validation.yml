name: Rust protocol validation

on:
  push:
    branches: [android10-arm64-wireless]
    paths:
      - 'src/**'
      - 'protobuf/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/rust-validation.yml'
  pull_request:
    branches: [android10-arm64-wireless]
    paths:
      - 'src/**'
      - 'protobuf/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/rust-validation.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check wireless protocol crate
        run: cargo check --locked --no-default-features --features wireless
